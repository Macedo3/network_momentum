[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-momentum-yfinance"
version = "1.0.0"
description = "Network Momentum do artigo arXiv:2308.11294 adaptado a equities globais do Yahoo Finance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "scipy>=1.13,<2",
    "yfinance>=0.2.65,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]
solver = ["cvxpy>=1.4,<2"]

[project.scripts]
network-momentum = "network_momentum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
markers = [
    "slow: testes de ponta a ponta mais demorados (~1-2 min)",
]
